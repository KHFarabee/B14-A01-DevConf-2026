<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DevConf 2026</title>
    <link rel="stylesheet" href="./assets/fontawesome/css/all.min.css" />
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="stylesheet" href="./css/utilities.css" />
    <link rel="stylesheet" href="./css/components.css" />
    <link rel="stylesheet" href="./css/custom.css" />
  </head>
  <body>
    <!-- HEADER -->
    <header id="header" class="flex items-center">
      <nav class="container flex justify-between items-center">
        <img
          id="logo"
          src="./assets/img/logo.png"
          alt="Developers Conference 2026"
        />
        <ul id="nav-items" class="flex gap-2">
          <li>Speakers</li>
          <li>Schedule</li>
          <li>Tracks</li>
          <li>Venue</li>
          <li>Blog</li>
        </ul>
        <button class="btn-primary btn-sm">Register Now</button>
      </nav>
    </header>
    <section
      id="hero"
      class="text-center flex flex-cols items-center justify-between"
    >
      <div class="text-white flex flex-cols gap-2 hero-text">
        <h2 class="text-xl">Code. <em class="text-xl">Connect.</em> Create</h2>
        <p class="text-lg">
          Join 4,000+ engineers, founders, and builders at the premier developer
          <br />
          conference of 2026. Three days of cutting-edge talks, hands-on
          workshops, <br />
          and meaningful connections.
        </p>
      </div>
      <button class="btn-primary btn-lg mb-20">Register Now</button>
    </section>

    <main id="main" class="container"></main>
  </body>
</html>
